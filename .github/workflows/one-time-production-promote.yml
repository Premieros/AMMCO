name: One-time AMMCO production alias

on:
  push:
    branches:
      - development/excel-intelligence-foundation-20260929

permissions:
  contents: read

jobs:
  alias:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Point production aliases to verified deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not configured"
            exit 2
          fi
          for alias in ammcofoods.vercel.app ammcofoods-premieros-3817.vercel.app ammcofoods-git-main-premieros-3817.vercel.app; do
            curl --fail-with-body --silent --show-error               -X POST "https://api.vercel.com/v2/deployments/dpl_6mxXJSxozV8fbwAk4SqFjWfssp9o/aliases?teamId=team_spQBjgWpl9p2ekmTMo1Wm3AI"               -H "Authorization: Bearer $VERCEL_TOKEN"               -H "Content-Type: application/json"               --data "{\"alias\":\"$alias\",\"redirect\":null}"
            echo
          done
